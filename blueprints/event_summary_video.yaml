blueprint:
  name: AI Event Summary - Video (v1.6.0)
  author: teofanis
  homeassistant:
    min_version: 2024.10.0
  description: >
    AI-powered summaries for security camera events using camera.record + video_analyzer.
    Records a clip immediately on trigger (with optional lookback), then analyzes it
    with LLM Vision. Sends a consolidated notification with the AI summary once analysis
    is complete.


    Requires the stream integration to be enabled. For lookback support, enable
    "Preload stream" on your camera entity.
  domain: automation
  input:
    run_conditions:
      name: Run Conditions
      description: All conditions must be true in order for the blueprint to run.
      default: []
      selector:
        condition: {}
    cooldown:
      name: Cooldown
      description: Time to wait before running automation again. Strongly recommended
        for busy areas.
      default:
        minutes: 10
      selector:
        duration: {}
    camera_sensor_section:
      name: Camera & Sensor Settings
      description: Settings for the camera and sensor entities.
      icon: mdi:camera
      input:
        camera_entities:
          name: Camera Entities
          description: List of camera entities to monitor
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - camera
              reorder: false
        trigger_state:
          name: Trigger State
          description: Automation starts when one of your camera changes to this state.
          default: recording
          selector:
            text:
              multiline: false
              multiple: false
        motion_sensors:
          name: Motion Sensor
          description: Set if your cameras don't change state (Frigate). Use the same
            order used for camera entities.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
              reorder: false
        duration:
          name: Recording Duration
          description: How long to record in seconds. The clip starts immediately on
            trigger (plus any lookback).
          default: 10
          selector:
            number:
              min: 3.0
              max: 60.0
              step: 1.0
              mode: slider
        lookback:
          name: Lookback
          description: >
            Seconds of video to include from before the trigger. Only works if the
            camera stream is already running (enable "Preload stream" on the camera
            entity). Set to 0 to disable.
          default: 0
          selector:
            number:
              min: 0.0
              max: 10.0
              step: 1.0
              mode: slider
        max_frames:
          name: Max Frames
          description: How many frames to extract from the clip. Picks frames with the
            most movement.
          default: 3
          selector:
            number:
              min: 1.0
              max: 10.0
              step: 1.0
              mode: slider
    ai_section:
      name: AI Settings
      description: AI settings for the analysis.
      icon: mdi:brain
      collapsed: true
      input:
        store_in_timeline:
          name: Store in Timeline
          description: Stores this event in the Timeline so you can ask about it.
          default: true
          selector:
            boolean: {}
        use_memory:
          name: Use Memory
          description: Use information stored in memory to provide additional context.
            Memory must be set up.
          default: false
          selector:
            boolean: {}
        message:
          name: Prompt
          description: Model prompt for the video_analyzer action
          default: 'Summarize the events based on a series of images captured at short
            intervals. Focus only on moving subjects such as people, vehicles, and
            other active elements. Ignore static objects and scenery. Provide a clear
            and concise account of movements and interactions. Do not mention or imply
            the existence of images—present the information as if directly observing
            the events. If no movement is detected, respond with: ''No activity observed.'''
          selector:
            text:
              multiline: true
              multiple: false
        provider:
          name: Provider
          description: Provider to use for analysis. See docs for additional information.
          selector:
            config_entry:
              integration: llmvision
        model:
          name: Model
          description: Which model to use. Depends on chosen provider.
          selector:
            text:
              multiline: false
              multiple: false
        target_width:
          name: Target Width
          description: Downscale images (uses less tokens and speeds up processing)
          default: 1280
          selector:
            number:
              min: 512.0
              max: 3840.0
              step: 1.0
              mode: slider
        max_tokens:
          name: Maximum Tokens
          description: >
            Maximum number of tokens to generate. Use this to control the length of the summaries.
          default: 4000
          selector:
            number:
              min: 1
              max: 10000
              step: 1
              mode: slider
    notification_section:
      name: Notification Settings
      description: Settings for the notification delivery. A single notification is
        sent after the clip is analyzed.
      icon: mdi:bell
      collapsed: true
      input:
        notify:
          name: Notify
          description: Send a notification to your phone.
          default: true
          selector:
            boolean: {}
        condition_notify:
          name: Condition to Notify
          description: Condition to notify the device.
          default: []
          selector:
            condition: {}
        notify_device:
          name: Notify Device
          description: The devices to send the notification to. Multiple devices may
            be used. Only works with Home Assistant mobile app.
          default: []
          selector:
            device:
              multiple: true
              filter:
              - integration: mobile_app
        notification_time:
          name: Notification Time
          description: Add time to Notification Title and choose between 12-hour or
            24-hour time format for the notification title.
          default: ''
          selector:
            select:
              options:
              - label: No Time Added
                value: ''
              - label: 12 Hour
                value: at {{ now().strftime("%-I:%M %p") }}
              - label: 24 Hour
                value: at {{ now().strftime("%H:%M") }}
              multiple: false
              sort: false
              custom_value: false
        tap_navigate:
          name: Tap Navigate
          description: Home Assistant dashboard to navigate to when notification is
            opened (e.g. /lovelace/cameras).
          default: /lovelace/0
          selector:
            text:
              multiline: false
              multiple: false
        delay_notification:
          name: Notification Cooldown
          description: Time in seconds to wait before sending another notification.
          default: 60
          selector:
            number:
              min: 0.0
              max: 86400.0
              unit_of_measurement: seconds
              mode: box
              step: 1.0
        notification_sticky:
          name: Sticky - Android Only
          description: 'When enabled, the notification will stay active on the device
            after tapping it and remain unless swiped.

            '
          default: true
          selector:
            boolean: {}
        notification_color:
          name: Notification Color - Android Only
          description: 'Set the color of the notification on your Android device,
            in HEX. (default = Steelblue - #03a9f4)'
          default: '#03a9f4'
          selector:
            select:
              options:
              - label: 'Steelblue - #03a9f4'
                value: '#03a9f4'
              - label: 'Red - #f44336'
                value: '#f44336'
              - label: 'Pink - #e91e63'
                value: '#e91e63'
              - label: 'Purple - #926bc7'
                value: '#926bc7'
              - label: 'Deep Purple - #6e41ab'
                value: '#6e41ab'
              - label: 'Indigo - #3f51b5'
                value: '#3f51b5'
              - label: 'Blue - #2196f3'
                value: '#2196f3'
              - label: 'Light Blue - #03a9f4'
                value: '#03a9f4'
              - label: 'Cyan - #00bcd4'
                value: '#00bcd4'
              - label: 'Teal - #009688'
                value: '#009688'
              - label: 'Green - #4caf50'
                value: '#4caf50'
              - label: 'Light Green - #8bc34a'
                value: '#8bc34a'
              - label: 'Lime - #cddc39'
                value: '#cddc39'
              - label: 'Yellow - #ffeb3b'
                value: '#ffeb3b'
              - label: 'Amber - #ffc107'
                value: '#ffc107'
              - label: 'Orange - #ff9800'
                value: '#ff9800'
              - label: 'Deep Orange - #ff5722'
                value: '#ff5722'
              - label: 'Brown - #795548'
                value: '#795548'
              - label: 'Light Grey - #bdbdbd'
                value: '#bdbdbd'
              - label: 'Grey - #9e9e9e'
                value: '#9e9e9e'
              - label: 'Dark Grey - #606060'
                value: '#606060'
              - label: 'Blue Grey - #607d8b'
                value: '#607d8b'
              - label: 'Black - #000000'
                value: '#000000'
              - label: White -#ffffff
                value: '#ffffff'
              custom_value: true
              sort: false
              multiple: false
        notification_icon:
          name: Notification Status Bar Icon - Android Only
          description: Change the icon that displays in the notification.
          default: mdi:cctv
          selector:
            icon:
              placeholder: mdi:cctv
        notification_channel:
          name: Custom Notification Channel or Alarm Mode - Android Only
          description: Create a new channel for notifications to allow custom notification
            sounds, vibration patterns, and override Do Not Disturb mode. Camera Name uses first Camera Entity if using multiple cameras. Configured
            directly on the Android device -> Home Assistant App Setting -> Notifications.
            Use `Alarm` to use the device's loud alarm notification sound. You can also type in your own channel name.
            [Learn More](https://companion.home-assistant.io/docs/notifications/notification-commands/#volume-level)
            (default = 'LLM Vision Snapshot').
          default: 'LLM Vision Snapshot'
          selector:
            select:
              options:
              - label: LLM Vision Snapshot
                value: 'LLM Vision Snapshot'
              - label: Camera Name
                value: '{{ camera }} Snapshot'
              - label: Alarm
                value: alarm_stream
              custom_value: true
              multiple: false
              sort: false
        tts_notification:
          name: Use Text-to-Speech (TTS) on your device to speak the notification.
            Android Only
          description: Enable TTS notification.
          default: false
          selector:
            boolean: {}
        tts_volume:
          name: TTS Volume (Android Only)
          description: "Set TTS volume to device's current alarm volume or Max volume.
            \n> [!NOTE]  \n> ALARM VOLUME WILL IGNORE DO NOT DISTURB!"
          default: notification_stream
          selector:
            select:
              options:
              - label: Notification Volume
                value: notification_stream
              - label: Alarm Volume/Sound
                value: alarm_stream
              - label: Max Alarm Volume/Sound
                value: alarm_stream_max
              multiple: false
              sort: false
              custom_value: false
        condition_notify_tts:
          name: Condition to TTS Notify
          description: Condition to TTS notify the device.
          default: []
          selector:
            condition: {}
        notification_sound:
          name: Notification Sound - iOS Only
          description: 'You can specify a sound file on your device that will play
            for the notifications. You can import the sound file into Home Assistant
            or enter the filename of the [pre-installed notification sound](https://companion.home-assistant.io/docs/notifications/notification-sounds/#pre-installed-notification-sounds)
            (example: US-EN-Alexa-Motion-Detected-Generic.wav).'
          default: default
          selector:
            select:
              options:
              - label: Default
                value: default
              - label: None
                value: none
              - label: Alexa Motion Detected
                value: US-EN-Alexa-Motion-Detected-Generic.wav
              - label: Morgan Freeman Motion Detected
                value: US-EN-Morgan-Freeman-Motion-Detected.wav
              custom_value: true
              sort: false
              multiple: false
        notification_volume:
          name: Volume Sound - iOS Only
          description: Specify a sound level %
          default: 1
          selector:
            number:
              max: 1.0
              min: 0.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
        notification_critical:
          name: Critical Notification - iOS Only
          description: Send as a critical notification to the mobile device. This
            will ignore silent/vibrate modes.
          default: false
          selector:
            boolean: {}
    experimental_section:
      name: Experimental Settings
      description: Experimental features. Use with caution.
      icon: mdi:apple-keyboard-option
      collapsed: true
      input:
        additional_actions:
          name: Additional Actions (Experimental)
          description: Additional actions to run after the AI analysis and notification.
            Some actions don't work and will prevent the automation from running,
            use with caution.
          default: []
          selector:
            action: {}
variables:
  store_in_timeline: !input store_in_timeline
  cooldown: !input cooldown
  notify_devices: !input notify_device
  notification_sticky: !input notification_sticky
  notification_color: !input notification_color
  notification_icon: !input notification_icon
  notification_channel: !input notification_channel
  notification_sound: !input notification_sound
  notification_volume: !input notification_volume
  notification_critical: !input notification_critical
  tts_volume: !input tts_volume
  tts_notification: !input tts_notification
  condition_notify_tts: !input condition_notify_tts
  additional_actions: !input additional_actions
  notify: !input notify
  condition_notify: !input condition_notify
  delay_notification: !input delay_notification
  duration: !input duration
  lookback: !input lookback
  device_name_map: "{% set ns = namespace(device_names=[]) %} {% for device_id in
    notify_devices %}\n  {% set device_name = device_attr(device_id, \"name\") %}\n
    \ {% set sanitized_name = \"mobile_app_\" + device_name | slugify  %}\n  {% set
    ns.device_names = ns.device_names + [sanitized_name] %}\n{% endfor %} {{ ns.device_names
    }}\n"
  camera_entities_list: !input camera_entities
  motion_sensors_list: !input motion_sensors
  camera_entity: "{% if motion_sensors_list and trigger is defined and trigger.entity_id
    is defined and not trigger.entity_id.startswith(\"camera\") %}\n  {% set sensor_index
    = motion_sensors_list.index(trigger.entity_id) if trigger.entity_id in motion_sensors_list
    else 0 %}\n  {{ camera_entities_list[sensor_index] if sensor_index < camera_entities_list|length
    else camera_entities_list[0] }}\n{% elif trigger is defined and trigger.entity_id
    is defined %}\n  {{ trigger.entity_id }}\n{% else %}\n  {{ camera_entities_list[0]
    if camera_entities_list else '' }}\n{% endif %}\n"
  tag: "{{ camera_entity + int(as_timestamp(now()))|string }}"
  label: Motion detected
  camera_message: >
    {{ camera_entity.replace("camera.", "").replace("_", " ")|capitalize }}
  camera: >
    {{ camera_entities_list[0].replace("camera.", "").replace("_", " ") | title }}
  camera_name: >
    {{ camera_entity.replace("camera.", "") }}
  clip_path: >
    /media/llmvision/recordings/{{ camera_name }}_latest.mp4
  notification_time: !input notification_time
max_exceeded: silent
mode: single
trigger:
- platform: state
  entity_id: !input camera_entities
  to: !input trigger_state
  id: camera_trigger
- platform: state
  entity_id: !input motion_sensors
  to: 'on'
  id: motion_sensor_trigger
condition:
- condition: and
  conditions: !input run_conditions
action:
- alias: Record clip from camera
  action: camera.record
  target:
    entity_id: '{{ camera_entity }}'
  data:
    filename: '{{ clip_path }}'
    duration: '{{ duration | int }}'
    lookback: '{{ lookback | int }}'
- alias: Wait for recording to finish
  delay:
    seconds: '{{ duration | int + 2 }}'
- alias: Analyze recorded clip
  action: llmvision.video_analyzer
  data:
    video_file: '{{ clip_path }}'
    provider: !input provider
    model: !input model
    message: !input message
    use_memory: !input use_memory
    store_in_timeline: '{{ store_in_timeline }}'
    expose_images: '{{ store_in_timeline }}'
    generate_title: '{{ store_in_timeline }}'
    include_filename: false
    max_frames: !input max_frames
    target_width: !input target_width
    max_tokens: !input max_tokens
  response_variable: response
- alias: Update label with title
  variables:
    label: '{{ response.title }}'
- if:
  - condition: template
    value_template: !input notify
  then:
  - if:
    - condition: !input condition_notify
    then:
    - if:
      - condition: template
        value_template: '{{ not this.attributes.last_triggered or (now() - this.attributes.last_triggered).seconds
          > delay_notification }}'
      then:
      - alias: Send notification with summary to notify devices
        repeat:
          for_each: '{{device_name_map}}'
          sequence:
          - action: notify.{{ repeat.item }}
            data:
              title: '{{ label }} {{ notification_time }}'
              message: '{{response.response_text}}'
              data:
                image: '{{response.key_frame.replace(''/media'',''/media/local'')
                  }}'
                url: !input tap_navigate
                clickAction: !input tap_navigate
                tag: '{{tag}}'
                group: !input notification_channel
                alert_once: true
                ttl: 0
                priority: high
                channel: !input notification_channel
                color: !input notification_color
                notification_icon: !input notification_icon
                sticky: !input notification_sticky
                push:
                  interruption-level: active
                  sound:
                    name: !input notification_sound
                    volume: !input notification_volume
                    critical: '{{ notification_critical }}'
                actions:
                - action: URI
                  title: See Snapshot
                  uri: '{{response.key_frame.replace(''/media'',''/media/local'')
                    }}'
  - if:
    - condition: template
      value_template: '{{ tts_notification }}'
    then:
    - if:
      - condition: !input condition_notify_tts
      then:
      - alias: TTS notification on notify devices
        repeat:
          for_each: '{{device_name_map}}'
          sequence:
          - action: notify.{{ repeat.item }}
            data:
              message: TTS
              data:
                ttl: 0
                priority: high
                media_stream: !input tts_volume
                tts_text: '{{response.response_text}}'
- choose: []
  default: !input additional_actions
- delay: !input cooldown
